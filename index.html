<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Convertidor de Temperaturas</title>
</head>
<body>

    <h1>Convertidor de Temperaturas</h1>

    <label for="celsius">Introduce grados Celsius:</label>

    <input type="number" id="celsius" placeholder="Ej. 25">

    <button onclick="convertirTemperatura()">Convertir</button>

    <h2>Resultados:</h2>

    <p id="resultadoFahrenheit"></p>
    <p id="resultadoKelvin"></p>
    <p id="resultadoRankine"></p>

    <script src="script.js"></script>

</body>
</html>
